<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FINPRO — Control de gastos del hogar</title>
<meta name="theme-color" content="#0a1114">
<meta name="robots" content="noindex">
<script src="/js/theme-init.js"></script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="Navegación principal">
    <a class="brand-lockup" href="#/dashboard" aria-label="FINPRO, ir al resumen">
      <span class="logo-mark"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="4" height="9" rx="1.5"/><rect x="10" y="4" width="4" height="16" rx="1.5"/><rect x="16" y="8" width="4" height="12" rx="1.5"/></svg></span><span>FIN<b>PRO</b></span>
    </a>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <button class="user-chip" type="button" data-action="user-menu" id="user-chip" aria-haspopup="menu"></button>
  </aside>

  <div class="content">
    <header class="topbar">
      <a class="brand-lockup" href="#/dashboard" aria-label="FINPRO">
        <span class="logo-mark"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="4" height="9" rx="1.5"/><rect x="10" y="4" width="4" height="16" rx="1.5"/><rect x="16" y="8" width="4" height="12" rx="1.5"/></svg></span><span>FIN<b>PRO</b></span>
      </a>
      <div class="period" id="period" role="group" aria-label="Período">
        <button type="button" data-action="period-prev" aria-label="Período anterior"></button>
        <output id="period-label" aria-live="polite"></output>
        <button type="button" data-action="period-next" aria-label="Período siguiente"></button>
      </div>
      <span class="spacer"></span>
      <div class="top-actions">
        <button class="btn btn-primary hide-mobile" type="button" data-action="add-tx" id="top-add"></button>
        <button class="btn btn-icon" type="button" data-action="toggle-theme" aria-label="Cambiar tema" id="top-theme"></button>
        <button class="btn btn-icon avatar-btn" type="button" data-action="user-menu" id="top-avatar" aria-label="Menú de usuario"></button>
      </div>
    </header>
    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navegación móvil"></nav>
<script src="/vendor/chart/chart.umd.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
